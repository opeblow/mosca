[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mosca-agent"
version = "0.1.0"
description = "Mosca as a teammate in a Switch room: scans, ranks quantum exposure, asks owners, rescans migration branches."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["mosca", "httpx>=0.27", "websockets>=13"]

[project.optional-dependencies]
dev = ["pytest>=8", "mosca-ledger"]

[project.scripts]
mosca-agent = "mosca_agent.cli:main"
mosca-coder = "mosca_agent.coder:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
