server {
    listen 443 ssl;
    server_name api.acme-payments.example;

    ssl_certificate     /etc/nginx/certs/api.pem;
    ssl_certificate_key /etc/nginx/certs/api.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:DES-CBC3-SHA;

    location / {
        proxy_pass http://payments:8080;
    }
}
