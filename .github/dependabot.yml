# Dependabot watches dependencies but opens no pull requests:
# updates are applied by hand, tested locally, and committed directly.
version: 2
updates:
  - package-ecosystem: pip
    directory: /core
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
  - package-ecosystem: pip
    directory: /ledger
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
  - package-ecosystem: pip
    directory: /agent
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
